<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tokenmost 设计改版 Demo · 现状 vs 改版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f7f5f0;--card:#fffdfa;--line:#e9e3d6;--line-soft:#f0ebe0;
  --ink:#14171e;--ink2:#3a4256;--muted:#7c7a72;
  --accent:#0f766e;--accent-soft:rgba(15,118,110,.08);--warn:#c97b3f;--bad:#b06367;
  --sans:"Outfit","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"DM Serif Display","Songti SC",Georgia,serif;
  --mono:"JetBrains Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;display:flex;flex-direction:column;overflow:hidden}

/* ── 顶栏 ── */
.top{background:var(--card);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;flex-shrink:0}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--serif);font-size:21px;font-weight:400;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.switch{display:flex;gap:4px;background:var(--cream);border:1px solid var(--line);border-radius:11px;padding:3px}
.switch button{font-family:inherit;font-size:13.5px;font-weight:500;color:var(--muted);background:none;border:none;border-radius:8px;padding:7px 15px;cursor:pointer;transition:all .15s;white-space:nowrap}
.switch button:hover{color:var(--ink)}
.switch button.on{background:var(--ink);color:#fff;font-weight:600}
.ctrls{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.seg{display:flex;gap:2px;background:var(--cream);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:none;border:none;border-radius:7px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--card);color:var(--accent);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.zoom{display:flex;align-items:center;gap:5px}
.zoom button{font-family:var(--mono);font-size:12px;background:var(--card);border:1px solid var(--line);color:var(--ink2);border-radius:7px;padding:4px 9px;cursor:pointer;min-width:28px}
.zoom button:hover{border-color:var(--accent);color:var(--accent)}
.zoom span{font-family:var(--mono);min-width:40px;text-align:center}
.plain{font-family:inherit;font-size:12px;background:var(--card);border:1px solid var(--line);color:var(--ink2);border-radius:7px;padding:5px 10px;cursor:pointer}
.plain:hover{border-color:var(--accent);color:var(--accent)}

/* ── 提示条 ── */
.hint{background:var(--accent-soft);border-bottom:1px solid var(--line);padding:9px 22px;font-size:13px;color:var(--ink2);display:flex;align-items:flex-start;gap:9px;flex-shrink:0}
.hint svg{color:var(--accent);flex-shrink:0;margin-top:2px}
.hint b{color:var(--ink)}
.hint .k{font-family:var(--mono);font-size:11.5px;background:var(--card);border:1px solid var(--line);border-radius:5px;padding:1px 6px;white-space:nowrap}
.hint .bad{color:var(--bad);font-weight:600}

/* ── 舞台 ── */
.stage{flex:1;min-height:0;display:flex;gap:12px;padding:12px;background:var(--cream);overflow:auto}
.frame-wrap{flex:1;min-width:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.04);transition:max-width .2s}
.frame-wrap[hidden]{display:none}          /* ← 关键：作者级 display 会覆盖 [hidden] */
.frame-wrap.vp-phone{max-width:390px}
.frame-wrap.vp-tab{max-width:768px}
.stage.split .frame-wrap.vp-phone,.stage.split .frame-wrap.vp-tab{max-width:none}
.frame-bar{display:flex;align-items:center;gap:8px;padding:7px 13px;background:var(--card);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);flex-shrink:0}
.frame-bar b{color:var(--ink);font-weight:600}
.frame-bar .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0}
.frame-bar .dot.old{background:#c98a8d}
.frame-bar .tag{margin-left:auto;font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
iframe{flex:1;width:100%;border:0;background:#fff}
.vp-badge{position:absolute;z-index:6;pointer-events:none;font-family:var(--mono);font-size:11px;background:var(--ink);color:#fff;padding:3px 10px;border-radius:999px}
@media(max-width:980px){
  .top{padding:10px 14px;gap:10px}
  .brand h1{font-size:17px}
  .brand span{display:none}
  .ctrls{margin-left:0;width:100%;justify-content:space-between}
  .stage{flex-direction:column}
  .hint{padding:8px 14px;font-size:12px}
}
</style>
</head>
<body>

<div class="top">
  <div class="brand">
    <h1>tokenmost 设计改版 Demo</h1>
    <span>本地离线 · 未部署 · 数据快照 2026-10-31</span>
  </div>
  <div class="switch">
    <button class="on" data-mode="v1">现状 v1</button>
    <button data-mode="v3">改版 v3</button>
    <button data-mode="split">并排对比</button>
  </div>
  <div class="ctrls">
    <div class="seg" id="vp">
      <button class="on" data-vp="full">自适应</button>
      <button data-vp="tab">平板 768</button>
      <button data-vp="phone">手机 390</button>
    </div>
    <div class="zoom">
      <button data-z="-10">−</button><span id="zoomVal">100%</span><button data-z="10">+</button>
    </div>
    <button class="plain" id="reset">重置</button>
  </div>
</div>

<div class="hint">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
  <span id="hintText"></span>
</div>

<div class="stage" id="stage">
  <div class="frame-wrap" id="w1">
    <div class="frame-bar"><span class="dot old"></span><b>现状 v1</b><span>index.html</span><span class="tag" id="tag1">表头错位 109px</span></div>
    <iframe id="f1" src="v1.html"></iframe>
  </div>
  <div class="frame-wrap" id="w2" hidden>
    <div class="frame-bar"><span class="dot"></span><b>改版 v3</b><span>index-v3.html</span><span class="tag" id="tag2" style="color:#0f766e;border-color:rgba(15,118,110,.4)">列对齐 ✓</span></div>
    <iframe id="f2" src="v3.html?theme=light"></iframe>
  </div>
</div>

<script>
const HINTS={
  v1:'<b>现状</b>：桌面对比表头「核验」列与数据徽章的 <span class="k">Δ109px</span> 错位；切到 <b>手机 390</b> 视口，会看到整页横向滚动（内容宽 <span class="k">1120px</span>，右侧 730px 在屏幕外）。',
  v3:'<b>改版 v3</b>：① 收益条形图 ② CTA 三级分级 ③ 模型目录默认折叠（点标题展开）④ 每行「详情」按钮 ⑤ 右上角 🌙 切暗色 ⑥ 顶部入群条降噪。切到 <b>手机 390</b> 对比首屏密度。',
  split:'<b>并排对比</b>：左 = 改版前，右 = 改版后，同一份数据、同一份样式令牌。'
};
const HINTS_PHONE={
  v1:'<b>现状 · 手机 390</b>：整页横向滚动 —— 内容实际宽 <span class="k">1120px</span>，右侧 730px 看不到；首屏只有 1.5 个平台。',
  v3:'<b>改版 · 手机 390</b>：<span class="bad">零横向滚动</span>，首屏 6+ 个平台，每行带收益条与分级按钮。',
  split:'<b>并排 · 手机 390</b>：同屏对比两版首屏密度与行高。'
};
const stage=document.getElementById('stage'),f1=document.getElementById('f1'),f2=document.getElementById('f2'),
      w1=document.getElementById('w1'),w2=document.getElementById('w2'),
      hintText=document.getElementById('hintText'),tag1=document.getElementById('tag1'),tag2=document.getElementById('tag2');
let mode='v1',vp='full',zoom=100;

function apply(){
  const split=mode==='split';
  w2.hidden=!split;
  stage.classList.toggle('split',split);
  w1.classList.toggle('vp-phone',vp==='phone');
  w1.classList.toggle('vp-tab',vp==='tab');
  w2.classList.toggle('vp-phone',vp==='phone');
  w2.classList.toggle('vp-tab',vp==='tab');
  if(split){w1.classList.remove('vp-phone','vp-tab');w2.classList.remove('vp-phone','vp-tab');}
  const scale=zoom/100;
  [f1,f2].forEach(f=>{f.style.transform='scale('+scale+')';f.style.transformOrigin='top left';f.style.height=(100/scale)+'%';});
  document.getElementById('zoomVal').textContent=zoom+'%';
  hintText.innerHTML=(vp==='phone'?HINTS_PHONE:HINTS)[mode];
  tag1.innerHTML = vp==='phone' ? '横向溢出 +730px' : '表头错位 109px';
  tag2.innerHTML = vp==='phone' ? '零横向滚动 ✓' : '列对齐 ✓';
  document.querySelectorAll('.switch button').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));
  document.querySelectorAll('#vp button').forEach(b=>b.classList.toggle('on',b.dataset.vp===vp));
}
document.querySelectorAll('.switch button').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;apply();}));
document.querySelectorAll('#vp button').forEach(b=>b.addEventListener('click',()=>{vp=b.dataset.vp;apply();}));
document.querySelectorAll('.zoom button').forEach(b=>b.addEventListener('click',()=>{zoom=Math.max(50,Math.min(150,zoom+ +b.dataset.z));apply();}));
document.getElementById('reset').addEventListener('click',()=>{zoom=100;mode='v1';vp='full';apply();});
/* 支持 #split / #phone 直达（方便分享特定视图） */
(function(){
  const h=(location.hash||'').replace('#','');
  if(['v1','v3','split'].includes(h))mode=h;
  if(['phone','tab','full'].includes(h))vp=h;
  apply();
})();
</script>
</body>
</html>

name: deploy-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # GITHUB_TOKEN 推送的自动同步提交不会再次触发 push 工作流。
  workflow_run:
    workflows: [daily-sync]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - name: Check source evidence before publishing
        env:
          TOKENMOST_BASE: ${{ github.event.before || github.event.workflow_run.head_sha }}
        run: |
          if [[ -n "$TOKENMOST_BASE" && ! "$TOKENMOST_BASE" =~ ^0+$ ]]; then
            baseline="$(mktemp)"
            git show "$TOKENMOST_BASE:deals.json" > "$baseline"
            python3 tools/source_audit.py --against "$baseline"
          else
            python3 tools/source_audit.py
          fi
      - name: Check token conversion formulas and static-page parity
        run: node tools/test_token_math.js
      - name: Assemble site (只发布站点文件，不含 .git/tools/工作流)
        run: |
          mkdir -p _site/guides _site/platform
          cp index.html en.html free-cloud-servers.html sites.json deals.json prices.json usage.json plans.json rss.xml robots.txt sitemap.xml manifest.webmanifest llms.txt llms-full.txt _site/
          mkdir -p _site/assets/logos
          cp assets/*.* _site/assets/ 2>/dev/null || true
          cp assets/logos/* _site/assets/logos/ 2>/dev/null || true
          cp guides/* _site/guides/ 2>/dev/null || true
          cp platform/* _site/platform/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: pages_artifact
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site
      - name: Wait for Pages artifact metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_REPOSITORY: ${{ github.repository }}
          PAGES_RUN_ID: ${{ github.run_id }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          url = f"https://api.github.com/repos/{os.environ['PAGES_REPOSITORY']}/actions/runs/{os.environ['PAGES_RUN_ID']}/artifacts"
          request = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
              "Accept": "application/vnd.github+json",
              "Cache-Control": "no-cache",
          })
          for attempt in range(10):
              try:
                  with urllib.request.urlopen(request, timeout=10) as response:
                      artifacts = json.load(response)["artifacts"]
                  matches = [a for a in artifacts if a["name"] == os.environ["PAGES_ARTIFACT_NAME"]]
                  if len(matches) == 1 and str(matches[0]["id"]) == os.environ["PAGES_ARTIFACT_ID"]:
                      print("Pages artifact metadata is ready")
                      break
              except (urllib.error.URLError, ValueError, KeyError):
                  pass
              time.sleep(2)
          else:
              raise SystemExit("Pages artifact metadata did not become available")
          PY
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

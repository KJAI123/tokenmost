name: daily-sync
on:
  schedule:
    - cron: "30 22 * * *"   # 北京时间 06:30，每日
    - cron: "30 10 * * *"   # 北京时间 18:30，每日第二次
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run sync pipeline
        run: |
          python3 tools/check.py        # 前置校验（当前数据必须合法）
          python3 tools/sync.py         # 抓取 → 更新 → 规则引擎 → 校验 + 重生成 rss
      - name: Commit and push if changed
        run: |
          git config user.name "tokenmost-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "🤖 auto-sync $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
